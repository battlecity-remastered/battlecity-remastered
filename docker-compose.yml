version: "3.9"

services:
  battlecity-ts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: battlecity-server-ts
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8121}
    ports:
      - "${PORT:-8121}:8121"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || '8121') + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
